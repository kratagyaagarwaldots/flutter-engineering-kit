name: Site

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "agents/**"
      - "site/**"
      - "README.md"
      - ".claude-plugin/plugin.json"
      - "scripts/build-site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the kit's invariants
        run: python3 scripts/validate-kit.py
      - name: Build the site from the kit
        run: python3 scripts/build-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
